workflows:
  android-workflow:
    name: IronForge AI - Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd ironforge_ai_github
          flutter pub get
      - name: Build APK
        script: |
          cd ironforge_ai_github
          flutter build apk --release
    artifacts:
      - ironforge_ai_github/build/app/outputs/flutter-apk/app-release.apk
