workflows:
  android-workflow:
    name: IronForge AI - Android APK
    max_build_duration: 60
    environment:
      flutter: 3.24.5
    scripts:
      - name: Get Flutter packages
        script: |
          cd ironforge_ai_github
          flutter pub get
      - name: Fix Gradle wrapper
        script: |
          cd ironforge_ai_github
          # Update gradle wrapper to compatible version
          sed -i 's/gradle-8.3-all/gradle-8.9-all/g' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          cat android/settings.gradle
      - name: Build APK
        script: |
          cd ironforge_ai_github
          flutter build apk --release
    artifacts:
      - ironforge_ai_github/build/app/outputs/flutter-apk/app-release.apk
