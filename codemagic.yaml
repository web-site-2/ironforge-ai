workflows:
  android-workflow:
    name: IronForge AI - Android APK
    max_build_duration: 60
    environment:
      flutter: 3.24.5
    scripts:
      - name: Get Flutter packages
        script: |
          cd ironforge_ai_github
          flutter pub get
      - name: Check plugins
        script: |
          cd ironforge_ai_github
          echo "=== .flutter-plugins ==="
          cat .flutter-plugins 2>/dev/null || echo "not found"
          echo "=== .flutter-plugins-dependencies ==="
          cat .flutter-plugins-dependencies 2>/dev/null | python3 -m json.tool 2>/dev/null | grep -A2 "embedding" || echo "no embedding refs"
          echo "=== pubspec.lock flutter_local ==="
          grep -A3 "hive\|youtube\|shared_pref\|go_router\|riverpod\|fl_chart" pubspec.lock | head -40
      - name: Build APK
        script: |
          cd ironforge_ai_github
          flutter build apk --release
    artifacts:
      - ironforge_ai_github/build/app/outputs/flutter-apk/app-release.apk
